<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fast Trans – Driver details</title>
<meta name="theme-color" content="#2b2b2b">
<style>
:root{--red:#e3002c;--ink:#2b2b2b;--mut:#6b6b6b;--bg:#f0f0f0;--line:#d6d6d6;--card:#fff}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
header{background:linear-gradient(#f7f7f7,#cfcfcf);border-bottom:4px solid var(--red);text-align:center;padding:18px 16px 14px}
header img{width:190px;max-width:70%;height:auto}
.lang{position:absolute;top:12px;right:12px;display:flex;gap:4px}
.lang button{border:1px solid var(--line);background:#fff;border-radius:6px;padding:4px 9px;font-weight:700;color:var(--mut);cursor:pointer}
.lang button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
main{max-width:560px;margin:0 auto;padding:14px 16px 40px}
h1{font-size:22px;margin:6px 0 4px;text-align:center}
.intro{color:var(--mut);text-align:center;margin:0 0 14px;font-size:15px}
.card{background:var(--card);border-radius:12px;padding:14px 16px 6px;margin-bottom:14px;border-left:4px solid var(--red);box-shadow:0 1px 3px rgba(0,0,0,.06)}
.card h2{font-size:17px;margin:0 0 10px;color:var(--red)}
label{display:block;font-weight:600;font-size:14px;margin-bottom:4px}
.req::after{content:" *";color:var(--red)}
.f{margin-bottom:12px}
input,select,textarea{width:100%;font:inherit;padding:11px 12px;border:1px solid var(--line);border-radius:8px;background:#fff;color:var(--ink)}
input:focus,select:focus,textarea:focus{outline:2px solid var(--red);border-color:var(--red)}
textarea{min-height:70px;resize:vertical}
.hint{font-size:13px;color:var(--mut);margin-top:4px}
.hint a{color:var(--red)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media(max-width:440px){.row{grid-template-columns:1fr;gap:0}.row.ph{grid-template-columns:1fr 1fr;gap:10px}}
.photo{border:2px dashed var(--line);border-radius:10px;padding:12px;text-align:center;cursor:pointer;background:#fafafa}
.photo img{max-width:100%;max-height:180px;border-radius:6px;display:none;margin:0 auto 6px}
.photo span{color:var(--mut);font-size:14px}
.photo input{display:none}
.check{display:flex;gap:10px;align-items:flex-start;font-weight:400;font-size:14px}
.check input{width:22px;height:22px;flex:none;margin-top:1px;accent-color:var(--red)}
.hide{display:none}
button.send{width:100%;padding:15px;font:inherit;font-weight:800;font-size:17px;color:#fff;background:var(--red);border:0;border-radius:10px;cursor:pointer;letter-spacing:.3px}
button.send:disabled{opacity:.6}
.err{color:var(--red);font-weight:600;margin:10px 0;text-align:center}
.done{text-align:center;padding:30px 10px}
.done .tick{width:70px;height:70px;border-radius:50%;background:var(--red);color:#fff;font-size:40px;line-height:70px;margin:0 auto 14px}
footer{background:var(--ink);color:#fff;text-align:center;font-size:13px;padding:14px 16px;border-top:3px solid var(--red)}
footer a{color:#ff4d6d;font-weight:700;text-decoration:none}
</style>
</head>

<main>
<div id="formWrap">
<h1 data-t="title"></h1>
<p class="intro" data-t="intro"></p>

<form id="f" novalidate>
<div class="card"><h2 data-t="s1"></h2>
  <div class="f"><label class="req" data-t="fullName"></label><input name="fullName" required autocomplete="name"></div>
  <div class="f"><label class="req" data-t="dob"></label><input name="dob" type="date" required></div>
  <div class="row">
    <div class="f"><label class="req" data-t="phone"></label><input name="phone" type="tel" required autocomplete="tel"></div>
    <div class="f"><label class="req" data-t="email"></label><input name="email" type="email" required autocomplete="email"></div>
  </div>
  <div class="f"><label class="req" data-t="address"></label><textarea name="address" required autocomplete="street-address"></textarea></div>
  <div class="f"><label class="req" data-t="postcode"></label><input name="postcode" required autocomplete="postal-code" style="text-transform:uppercase"></div>
</div>

<div class="card"><h2 data-t="s2"></h2>
  <div class="f"><label class="req" data-t="emName"></label><input name="emName" required></div>
  <div class="row">
    <div class="f"><label class="req" data-t="emPhone"></label><input name="emPhone" type="tel" required></div>
    <div class="f"><label class="req" data-t="emRel"></label><input name="emRel" required></div>
  </div>
</div>

<div class="card"><h2 data-t="s3"></h2>
  <div class="f"><label class="req" data-t="ni"></label><input name="ni" required placeholder="QQ 12 34 56 A" style="text-transform:uppercase"></div>
  <div class="f"><label class="req" data-t="bankName"></label><input name="bankName" required></div>
  <div class="row">
    <div class="f"><label class="req" data-t="sortCode"></label><input name="sortCode" required inputmode="numeric" placeholder="12-34-56"></div>
    <div class="f"><label class="req" data-t="accNo"></label><input name="accNo" required inputmode="numeric" maxlength="8" placeholder="12345678"></div>
  </div>
</div>

<div class="card"><h2 data-t="s4"></h2>
  <div class="f"><label class="req" data-t="rtw"></label>
    <select name="rtw" id="rtw" required>
      <option value="" data-t="choose"></option>
      <option value="British / Irish citizen" data-t="rtw1"></option>
      <option value="EU Settled / Pre-settled status" data-t="rtw2"></option>
      <option value="Visa / BRP" data-t="rtw3"></option>
      <option value="Other" data-t="rtw4"></option>
    </select></div>
  <div class="f hide" id="rtwBox"><label class="req" data-t="rtwCode"></label><input name="rtwCode" style="text-transform:uppercase">
    <div class="hint"><span data-t="rtwHint"></span> <a href="https://www.gov.uk/prove-right-to-work" target="_blank">gov.uk/prove-right-to-work</a></div></div>
</div>

<div class="card"><h2 data-t="s5"></h2>
  <div class="f"><label class="req" data-t="licenceNo"></label><input name="licenceNo" required maxlength="18" style="text-transform:uppercase"></div>
  <div class="f"><label class="req" data-t="points"></label><input name="points" type="number" min="0" max="12" required inputmode="numeric"></div>
  <div class="f hide" id="ptsBox"><label class="req" data-t="pointsDetails"></label><textarea name="pointsDetails"></textarea></div>
  <div class="f"><label class="req" data-t="dvlaCode"></label><input name="dvlaCode" required style="text-transform:uppercase">
    <div class="hint"><span data-t="dvlaHint"></span> <a href="https://www.gov.uk/view-driving-licence" target="_blank">gov.uk/view-driving-licence</a></div></div>
  <div class="row ph">
    <div class="f"><label class="req" data-t="front"></label>
      <label class="photo"><img id="pvFront" alt=""><span data-t="tap"></span><input type="file" accept="image/*" id="licFront"></label></div>
    <div class="f"><label class="req" data-t="back"></label>
      <label class="photo"><img id="pvBack" alt=""><span data-t="tap"></span><input type="file" accept="image/*" id="licBack"></label></div>
  </div>
</div>

<div class="card"><h2 data-t="s6"></h2>
  <div class="f"><label class="check"><input type="checkbox" id="c1"><span data-t="c1"></span></label></div>
  <div class="f"><label class="check"><input type="checkbox" id="c2"><span data-t="c2"></span></label></div>
</div>

<div class="err" id="err"></div>
<button class="send" id="send" type="submit" data-t="send"></button>
</form>
</div>

<div class="done hide" id="done">
  <div class="tick">✓</div>
  <h1 data-t="thanks"></h1>
  <p class="intro" data-t="thanks2"></p>
</div>

  L = l; document.documentElement.lang = l;

  document.querySelectorAll('.lang button').forEach(b => b.classList.toggle('on', b.dataset.l === l));

  const need = Number(f.points.value) > 0;

};

const photos = {};
function shrink(file){
  return new Promise((res, rej) => {
    const img = new Image(), url = URL.createObjectURL(file);
    img.onload = () => {
      const max = 1600, k = Math.min(1, max / Math.max(img.width, img.height));
      const c = document.createElement('canvas');
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      res(c.toDataURL('image/jpeg', 0.82));
    };
    img.onerror = rej; img.src = url;
  });
}
[['#licFront','#pvFront','front'],['#licBack','#pvBack','back']].forEach(([inp, pv, key]) => {
  $(inp).onchange = async e => {
    const file = e.target.files[0]; if (!file) return;
    const data = await shrink(file);
    photos[key] = data;
    const p = $(pv); p.src = data; p.style.display = 'block';
  };
});

f.onsubmit = async e => {

  const err = $('#err'); err.textContent = '';
  const bad = [...f.querySelectorAll('[required]')].filter(x => !String(x.value).trim());
  f.querySelectorAll('input,select,textarea').forEach(x => x.style.borderColor = '');
  if (bad.length){ bad.forEach(x => x.style.borderColor = 'var(--red)'); bad[0].focus(); err.textContent = T[L].errFill; return; }
  if (!photos.front || !photos.back){ err.textContent = T[L].errPhoto; return; }
  if (!$('#c1').checked || !$('#c2').checked){ err.textContent = T[L].errCheck; return; }

  const d = {};
  new FormData(f).forEach((v, k) => d[k] = String(v).trim());
  ['postcode','ni','rtwCode','licenceNo','dvlaCode'].forEach(k => d[k] = (d[k] || '').toUpperCase());
  const pack = s => ({ type: 'image/jpeg', data: s.split(',')[1] });
  d.licenceFront = pack(photos.front); d.licenceBack = pack(photos.back);

  const btn = $('#send'); btn.disabled = true; btn.textContent = T[L].sending;
  try {
    const r = await fetch(SCRIPT_URL, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(d) });
    const j = await r.json();
    if (!j.ok) throw new Error(j.error);
    $('#formWrap').classList.add('hide'); $('#done').classList.remove('hide'); window.scrollTo(0, 0);
  } catch (x) {
    err.textContent = T[L].errSend; btn.disabled = false; btn.textContent = T[L].send;
  }
};
</script>
</body>
</html>
